<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PageMind</title>
  <link rel="stylesheet" href="sidepanel/styles/tokens.css" />
  <link rel="stylesheet" href="sidepanel/styles/reset.css" />
  <link rel="stylesheet" href="sidepanel/styles/utilities.css" />
  <link rel="stylesheet" href="sidepanel/styles/components/buttons.css" />
  <link rel="stylesheet" href="sidepanel/styles/components/cards.css" />
  <link rel="stylesheet" href="sidepanel/styles/base.css" />
  <link rel="stylesheet" href="sidepanel/styles/page-header.css" />
  <link rel="stylesheet" href="sidepanel/styles/prompt-controls.css" />
  <link rel="stylesheet" href="sidepanel/styles/content-modules.css" />
  <link rel="stylesheet" href="sidepanel/styles/full-content.css" />
  <link rel="stylesheet" href="sidepanel/styles/images.css" />
  <link rel="stylesheet" href="sidepanel/styles/actions.css" />
  <link rel="stylesheet" href="sidepanel/styles/results.css" />
  <link rel="stylesheet" href="sidepanel/styles/history.css" />
  <link rel="stylesheet" href="sidepanel/styles/drawer.css" />
  <link rel="stylesheet" href="sidepanel/styles/scrollbar.css" />
  <link rel="stylesheet" href="sidepanel/styles/tooltip.css" />
  <link rel="stylesheet" href="sidepanel/styles/modal.css" />
</head>
<body>

<div class="page-info">
  <input id="includePageContent" type="checkbox" checked hidden />
  <div class="page-info-grid">
    <div class="page-text">
      <div class="page-title" id="pageTitle">—</div>
      <div class="page-url" id="pageUrl">—</div>
    </div>
    <div class="header-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg class="brand-icon" viewBox="0 0 200 200" width="32" height="32">
          <rect width="200" height="200" rx="44" fill="#14181a"/>
          <text x="30" y="148" font-family="'Instrument Serif', Fraunces, Georgia, serif" font-size="160" font-style="italic" font-weight="500" fill="#3d6249">P</text>
          <text x="70" y="148" font-family="'Instrument Serif', Fraunces, Georgia, serif" font-size="150" font-style="italic" font-weight="500" fill="#f4efe4">m</text>
          <rect x="24" y="156" width="150" height="2.4" fill="#c08a3e"/>
          <circle cx="190" cy="155" r="7" fill="#c08a3e"/>
        </svg>
      </span>
      <span class="brand-name" aria-label="PageMind"><span class="brand-page">Page</span><span class="brand-mind">Mind</span></span>
    </div>
    <div class="context-controls">
      <button class="context-summary-btn context-state-empty" id="expandContentPanelBtn" type="button" title="管理网页上下文内容">
        <span class="context-main">
          <svg class="icon context-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M8 13h8"></path>
            <path d="M8 17h5"></path>
          </svg>
          <span class="context-title">还没有网页内容</span>
        </span>
        <span class="context-meta">获取内容后会显示在这里</span>
      </button>
      <button class="context-action-btn" id="refreshPageBtn" type="button" title="获取网页内容">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 12V5.75c0-.16-.06-.31-.18-.43l-3.14-3.14A.6.6 0 0 0 16.25 2H4.6a.6.6 0 0 0-.6.6v18.8c0 .33.27.6.6.6H11"></path>
          <path d="M8 10h8M8 6h4M8 14h3"></path>
          <path d="m20.5 20.5 1.5 1.5"></path>
          <path d="M15 18a3 3 0 1 0 6 0 3 3 0 0 0-6 0Z"></path>
          <path d="M16 5.4V2.35a.35.35 0 0 1 .6-.25l3.3 3.3a.35.35 0 0 1-.25.6H16.6a.6.6 0 0 1-.6-.6Z"></path>
        </svg>
        <span>获取网页内容</span>
      </button>
    </div>
  </div>
</div>

<div class="result-area" id="resultArea">
  <div class="result-placeholder">
    <div class="placeholder-icon-wrapper">
      <svg class="placeholder-brand-icon" viewBox="0 0 200 200" aria-hidden="true">
        <rect width="200" height="200" rx="44" fill="#14181a"/>
        <text x="30" y="148" font-family="'Instrument Serif', Fraunces, Georgia, serif" font-size="160" font-style="italic" font-weight="500" fill="#3d6249">P</text>
        <text x="70" y="148" font-family="'Instrument Serif', Fraunces, Georgia, serif" font-size="150" font-style="italic" font-weight="500" fill="#f4efe4">m</text>
        <rect x="24" y="156" width="150" height="2.4" fill="#c08a3e"/>
        <circle cx="190" cy="155" r="7" fill="#c08a3e"/>
      </svg>
    </div>
    <div class="placeholder-title">你好，我是 PageMind</div>
    <div class="placeholder-copy">我可以帮你总结网页、分析图片或回答问题</div>
  </div>
</div>

<div class="input-container">
  <input class="image-input" id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
  <input class="image-input" id="fileInput" type="file" accept=".txt,.md,.markdown,.csv,.json,.html,.htm,.xml,.log,.js,.jsx,.ts,.tsx,.css,.py,.java,.c,.cpp,.h,.hpp,.go,.rs,.sql,.yaml,.yml,text/*,application/json,application/xml" multiple />
  <div class="image-preview-bar" id="imagePreviewList"></div>

  <div class="input-card">
    <div class="input-main-row">
      <div class="input-wrapper">
        <textarea id="promptInput" rows="1" placeholder="继续追问 PageMind…" spellcheck="false"></textarea>
      </div>

      <button class="send-btn" id="summarizeBtn" title="发送">
        <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>

    <div class="input-toolbar-row">
      <div class="input-actions-left">
        <button class="attachment-btn" id="attachmentBtn" title="截屏识别" aria-label="截屏识别" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 3H5a2 2 0 0 0-2 2v2"></path>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            <path d="M8 12h8"></path>
            <path d="M12 8v8"></path>
          </svg>
        </button>
        <button class="multi-select-btn" id="qaSelectToggleBtn" type="button" title="多选导出聊天记录" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6h11"></path>
            <path d="M9 12h11"></path>
            <path d="M9 18h11"></path>
            <path d="M4 6h.01"></path>
            <path d="M4 12h.01"></path>
            <path d="M4 18h.01"></path>
          </svg>
          <span>多选导出聊天记录</span>
        </button>
        <div class="attachment-menu" id="attachmentMenu">
          <button class="menu-item" id="addImageBtn" title="上传图片作为附件">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            上传图片
          </button>
          <button class="menu-item" id="addFileBtn" title="上传文本、Markdown、CSV、JSON 或代码文件作为附件">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h8"></path><path d="M8 17h5"></path></svg>
            上传文件
          </button>
        </div>
      </div>

      <div class="input-actions-right">
        <button class="prompt-drawer-btn prompt-expand-open-btn" id="promptExpandBtn" type="button" title="打开放大编辑器">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h6v6"></path>
            <path d="M21 3l-7 7"></path>
            <path d="M9 21H3v-6"></path>
            <path d="M3 21l7-7"></path>
          </svg>
          <span>放大编辑</span>
        </button>
        <button class="prompt-drawer-btn prompt-template-open-btn" id="promptDrawerBtn" type="button" title="自定义提示词">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
          <span>自定义提示词</span>
        </button>
        <button class="prompt-drawer-btn prompt-history-open-btn" id="historyDrawerBtn" type="button" title="会话管理">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path><path d="M12 7v5l3 2"></path></svg>
          <span>会话管理</span>
        </button>
      </div>
    </div>
  </div>
  
</div>

<div class="prompt-expand-overlay" id="promptExpandOverlay" hidden>
  <div class="prompt-expand-panel" role="dialog" aria-modal="true" aria-labelledby="promptExpandTitle">
    <div class="prompt-expand-header">
      <div class="prompt-expand-title-block">
        <span class="prompt-expand-kicker">PageMind</span>
        <h3 id="promptExpandTitle">放大编辑</h3>
      </div>
      <button class="close-drawer-btn" id="closePromptExpandBtn" type="button" title="收起编辑器">&times;</button>
    </div>

    <textarea id="promptExpandInput" class="prompt-expand-input" placeholder="继续追问 PageMind…" spellcheck="false"></textarea>

    <div class="prompt-expand-footer">
      <span class="prompt-expand-hint">Enter 换行，Ctrl/Cmd + Enter 发送</span>
      <div class="prompt-expand-actions">
        <button class="mini-btn" id="applyPromptExpandBtn" type="button">收起</button>
        <button class="prompt-icon-btn primary" id="sendPromptExpandBtn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          发送
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 抽屉式面板 -->
<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="drawer-panel" id="historyDrawer">
  <div class="drawer-header">
    <h3>会话管理</h3>
    <div class="drawer-actions">
      <span class="history-count" id="historyCount">0/0 个会话 · 0 条</span>
      <button class="mini-btn primary" id="newSessionBtn" type="button" title="新建会话">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        <span>新建</span>
      </button>
      <button class="mini-btn subtle-danger" id="clearHistoryBtn" type="button" title="清空全部历史">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
        <span>清空</span>
      </button>
      <button class="close-drawer-btn" id="closeHistoryDrawerBtn" title="关闭">&times;</button>
    </div>
  </div>
  <div class="drawer-content history-drawer-content">
    <input class="history-search-input" id="historySearchInput" type="search" placeholder="搜索会话、网址、问题、网页内容或回复" />
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<div class="drawer-panel" id="promptDrawer">
  <div class="drawer-header">
    <h3>提示词模板</h3>
    <div class="drawer-actions">
      <button class="mini-btn primary" id="createNewPromptBtn" type="button" title="新增模板">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        <span>新增</span>
      </button>
      <button class="close-drawer-btn" id="closePromptDrawerBtn" title="关闭">&times;</button>
    </div>
  </div>
  <div class="drawer-content">
    <div class="prompt-list" id="promptList">
      <!-- 模板列表将在这里生成 -->
    </div>
  </div>
</div>

<div class="drawer-panel" id="promptEditorDrawer">
  <div class="drawer-header">
    <h3 id="editorTitle">新增模板</h3>
    <button class="close-drawer-btn" id="closeEditorBtn" title="关闭">&times;</button>
  </div>
  <div class="drawer-content">
    <div class="prompt-editor-form">
      <div class="prompt-field">
        <span>模板名称</span>
        <input type="text" id="promptNameInput" placeholder="例如：总结全文">
      </div>
      <div class="prompt-field">
        <span>提示词内容</span>
        <textarea id="promptTextInput" placeholder="输入提示词内容..." spellcheck="false"></textarea>
      </div>
      <div class="prompt-editor-actions">
        <button class="prompt-icon-btn danger" id="deletePromptBtn" title="删除模板">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          删除
        </button>
        <button class="prompt-icon-btn primary" id="savePromptBtn" title="保存模板">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          保存
        </button>
      </div>
    </div>
  </div>
</div>

<div class="drawer-panel" id="contentPreviewPanel">
  <div class="drawer-header">
    <h3>内容预览</h3>
    <div class="drawer-actions">
      <button class="mini-btn" id="selectAllModulesBtn" type="button" title="选择全部内容模块">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <span>全选</span>
      </button>
      <button class="mini-btn subtle-danger" id="clearModulesBtn" type="button" title="清除全部网页内容">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
        <span>清除</span>
      </button>
      <button class="close-drawer-btn" id="closePreviewBtn" title="关闭">&times;</button>
    </div>
  </div>
  <div class="drawer-content">
    <div class="content-module-list" id="contentModuleList"></div>
  </div>
</div>

<div class="drawer-panel full" id="fullContentViewer">
  <div class="drawer-header">
    <div class="drawer-title-block">
      <h3 id="fullContentTitle">全文视图</h3>
      <div class="full-content-meta" id="fullContentMeta">拖选文本后可加入发送内容</div>
    </div>
  </div>
  <div class="full-content-floating-actions" aria-label="全文操作">
    <div class="full-content-mode-guide" id="fullContentModeGuide"></div>
    <div class="full-content-action-buttons">
      <button class="floating-action-btn" id="addSelectedTextBtn" type="button" title="进入摘录模式" aria-label="进入摘录模式" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <span class="action-label">摘录</span>
      </button>
      <button class="floating-action-btn primary" id="closeFullContentBtn" type="button" title="保存并关闭" aria-label="保存并关闭">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span class="action-label">保存</span>
      </button>
    </div>
  </div>
  <div class="drawer-content">
    <div class="full-content-rich-text" id="fullContentText" tabindex="0" contenteditable="true" spellcheck="false" aria-label="可编辑全文内容"></div>
  </div>
  <div class="full-content-selection-status" id="fullContentSelectionStatus">
    <span id="fullContentSelectionText">未选择片段</span>
    <button class="selection-apply-btn" id="applyFullContentSelectionsBtn" type="button" title="执行摘录操作" disabled>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span>执行</span>
    </button>
    <button class="selection-clear-btn" id="clearFullContentSelectionsBtn" type="button" title="清空暂存选区">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
      <span>清空</span>
    </button>
    <div class="selection-preview-list" id="fullContentSelectionPreviewList"></div>
  </div>
</div>

<div class="drawer-panel full" id="submittedContentViewer">
  <div class="drawer-header">
    <div class="drawer-title-block">
      <h3 id="submittedContentTitle">提交内容</h3>
      <div class="full-content-meta" id="submittedContentMeta">—</div>
    </div>
    <button class="close-drawer-btn" id="closeSubmittedContentBtn" title="关闭">&times;</button>
  </div>
  <div class="drawer-content submitted-content-viewer-content">
    <div class="submitted-question-block">
      <div class="submitted-question-label">当时的问题</div>
      <div class="submitted-question-text" id="submittedContentQuestion"></div>
    </div>
    <pre class="submitted-full-text" id="submittedContentText"></pre>
  </div>
</div>

<script src="sidepanel/features/tooltip.js"></script>
<script type="module" src="sidepanel/app.js"></script>
</body>
</html>
